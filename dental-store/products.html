<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalCraft Pro | Products Catalog - Shop Dental Supplies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-11 h-11 bg-gradient-to-tr from-cyan-600 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-cyan-500/20">
                        <i class="fa-solid fa-tooth text-2xl"></i>
                    </div>
                    <div>
                        <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-cyan-700 bg-clip-text text-transparent">DentalCraft</span>
                        <span class="block text-[10px] font-semibold text-cyan-600 tracking-widest uppercase">Pro Store</span>
                    </div>
                </div>
                <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold text-slate-600">
                    <a href="index.html" class="hover:text-cyan-600 transition-colors">Home</a>
                    <a href="products.html" class="text-cyan-600 font-bold">Products Catalog</a>
                    <a href="prosthetics.html" class="hover:text-cyan-600 transition-colors">Prosthetics Lab</a>
                    <a href="about.html" class="hover:text-cyan-600 transition-colors">About Us</a>
                    <a href="contact.html" class="hover:text-cyan-600 transition-colors">Contact</a>
                </nav>
                <div class="flex items-center space-x-4">
                    <button id="cart-btn" class="relative p-2.5 rounded-full text-slate-700 hover:bg-slate-100 transition-all">
                        <i class="fa-solid fa-bag-shopping text-xl"></i>
                        <span id="cart-badge" class="absolute -top-1 -right-1 bg-cyan-600 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Products Section -->
    <section class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center max-w-2xl mx-auto mb-10">
                <h1 class="text-4xl font-extrabold text-slate-900">Comprehensive Dental Catalog</h1>
                <p class="text-slate-500 mt-2">Explore over 15 professional tools, equipment, and dental restoration materials.</p>
            </div>

            <!-- Categories Filter -->
            <div id="category-pills" class="flex flex-wrap justify-center gap-3 mb-12">
                <!-- Rendered by JS -->
            </div>

            <!-- Products Grid -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Rendered by JS -->
            </div>
        </div>
    </section>

    <!-- Cart Drawer -->
    <div id="cart-drawer-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden transition-opacity"></div>
    <aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-50 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-cart-shopping text-cyan-600 text-xl"></i>
                <h2 class="text-lg font-bold text-slate-900">Your Shopping Cart</h2>
            </div>
            <button id="close-cart-btn" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 border-t border-slate-200 bg-slate-50 space-y-4">
            <div class="flex justify-between text-base font-bold text-slate-900">
                <span>Total Amount:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <button onclick="checkout()" class="w-full py-3.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold rounded-xl shadow-md transition-all">
                Proceed to Checkout
            </button>
        </div>
    </aside>

    <footer class="bg-slate-950 text-slate-400 py-10 border-t border-slate-800 text-sm text-center">
        <p>&copy; 2026 DentalCraft Pro Store. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
